version: '3.4'

### Common Variables
x-common-variables: &common_variables
  POSTGRESQL_POSTGRES_PASSWORD: adminpassword
  POSTGRESQL_USERNAME: myuser
  POSTGRESQL_PASSWORD: mypassword
  POSTGRESQL_DATABASE: settlement
  REPMGR_PASSWORD: repmgrpassword
  REPMGR_PRIMARY_PORT: 5432
  REPMGR_PORT_NUMBER: 5432

### DB Health Check
x-db-health-check: &db_health_check
  healthcheck:
    test: >
      CMD-SHELL pg_isready 
      -U $${POSTGRESQL_USERNAME}
      -d $${POSTGRESQL_DATABASE}
    interval: 5s
    retries: 10

### Redis Health Check
x-redis-health-check: &redis_health_check
  healthcheck:
    test: >
      CMD
      redis-cli
      ping
    interval: 5s
    retries: 10

services:
  ### USER SERVICE ###
  # DBs
  postgres-user-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-user-primary-0
      REPMGR_NODE_NAME: postgres-user-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-user-primary-0
      REPMGR_PARTNER_NODES: postgres-user-primary-0,postgres-user-standby-1:5432
    networks:
      - user_network
    <<: *db_health_check
    restart: always

  postgres-user-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-user-primary-0
      REPMGR_NODE_NAME: postgres-user-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-user-standby-1
      REPMGR_PARTNER_NODES: postgres-user-primary-0,postgres-user-standby-1:5432
    networks:
      - user_network
    <<: *db_health_check
    restart: always

  ### VIDEO SERVICE ###
  # DBs
  postgres-video-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5434:5432"
    volumes:
      - postgres_video_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-video-primary-0
      REPMGR_NODE_NAME: postgres-video-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-video-primary-0
      REPMGR_PARTNER_NODES: postgres-video-primary-0,postgres-video-standby-1:5432
    networks:
      - video_network
    <<: *db_health_check
    restart: always

  postgres-video-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5435:5432"
    volumes:
      - postgres_video_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-video-primary-0
      REPMGR_NODE_NAME: postgres-video-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-video-standby-1
      REPMGR_PARTNER_NODES: postgres-video-primary-0,postgres-video-standby-1:5432
    networks:
      - video_network
    <<: *db_health_check
    restart: always

  # Redis
  cache-server:
    image: redis
    ports:
      - "6379:6379"
    <<: *redis_health_check
    networks:
      - video_network

  ### ADJUSTMENT SERVICE ###
  # DBs
  postgres-adjustment-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5436:5432"
    volumes:
      - postgres_adjustment_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-adjustment-primary-0
      REPMGR_NODE_NAME: postgres-adjustment-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-adjustment-primary-0
      REPMGR_PARTNER_NODES: postgres-adjustment-primary-0,postgres-adjustment-standby-1:5432
    networks:
      - adjustment_network
    <<: *db_health_check
    restart: always

  postgres-adjustment-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5437:5432"
    volumes:
      - postgres_adjustment_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-adjustment-primary-0
      REPMGR_NODE_NAME: postgres-adjustment-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-adjustment-standby-1
      REPMGR_PARTNER_NODES: postgres-adjustment-primary-0,postgres-adjustment-standby-1:5432
    networks:
      - adjustment_network
    <<: *db_health_check
    restart: always


  # Meta DB
  postgres-adjustment-metadata:
    image: bitnami/postgresql:15
    ports:
      - "5438:5432"
    volumes:
      - postgres_adjustment_metadata:/bitnami/postgresql
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: adminpassword
      POSTGRESQL_USERNAME: myuser
      POSTGRESQL_PASSWORD: mypassword
      POSTGRESQL_DATABASE: settlement
    networks:
      - adjustment_network
    <<: *db_health_check
    restart: always

volumes:
  postgres_user_primary_data:
  postgres_user_standby_data:
  postgres_video_primary_data:
  postgres_video_standby_data:
  postgres_adjustment_primary_data:
  postgres_adjustment_standby_data:
  postgres_adjustment_metadata:

networks:
  user_network:
  video_network:
  adjustment_network:
  app_network: