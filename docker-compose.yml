version: '3.4'

### Common Variables ###
x-common-variables: &common_variables
  POSTGRESQL_POSTGRES_PASSWORD: adminpassword
  POSTGRESQL_USERNAME: myuser
  POSTGRESQL_PASSWORD: mypassword
  POSTGRESQL_DATABASE: settlement
  REPMGR_PASSWORD: repmgrpassword
  REPMGR_PRIMARY_PORT: 5432
  REPMGR_PORT_NUMBER: 5432

### Health Checks ###
x-health-checks:
  zookeeper: &zookeeper_health_check
    test: echo srvr | nc localhost 2181 || exit 1
    interval: 10s
    timeout: 5s
    retries: 5

  kafka: &kafka_health_check
    test: nc -z localhost 9092 || exit 1
    interval: 30s
    timeout: 10s
    retries: 5

  prometheus: &prometheus_health_check
    test: wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1
    interval: 10s
    timeout: 5s
    retries: 5
  
  redis: &redis_health_check
    test: redis-cli ping
    interval: 5s
    retries: 10

  postgres: &postgres_health_check
    test: pg_isready -U ${POSTGRESQL_USERNAME} -d ${POSTGRESQL_DATABASE}
    interval: 5s
    retries: 10

services:
  ### KAFKA SERVICE ###
  # Zookeeper
  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka_network
    healthcheck: *zookeeper_health_check
    restart: unless-stopped

  # Kafka
  kafka:
    image: wurstmeister/kafka:latest
    ports:
      - "9092:9092"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 추가 설정
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_DELETE_TOPIC_ENABLE: 'true'
    networks:
      - kafka_network
      - app_network
    healthcheck: *kafka_health_check
    depends_on:
      zookeeper:
        condition: service_healthy
    restart: unless-stopped

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8989:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      # 추가 설정
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks:
      - kafka_network
    depends_on:
      - kafka
    restart: unless-stopped

  ### Monitoring ###
  # Prometheus
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring_network
      - app_network
    healthcheck: *prometheus_health_check
    restart: unless-stopped

  # Grafana
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - monitoring_network
    depends_on:
      - prometheus
    restart: unless-stopped
  
  ### Redis ###
  # video-service
  video-cache-server:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - video_network
    healthcheck: *redis_health_check
    restart: unless-stopped

  # adjustment-service
  adjustment-cache-server:
    image: redis:latest
    ports:
      - "6380:6379"
    networks:
      - adjustment_network
    healthcheck: *redis_health_check
    restart: unless-stopped

  ### USER SERVICE ###
  # DBs
  postgres-user-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5432:5432"
    volumes:
      - postgres_user_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-user-primary-0
      REPMGR_NODE_NAME: postgres-user-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-user-primary-0
      REPMGR_PARTNER_NODES: postgres-user-primary-0,postgres-user-standby-1:5432
    networks:
      - user_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  postgres-user-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5433:5432"
    volumes:
      - postgres_user_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-user-primary-0
      REPMGR_NODE_NAME: postgres-user-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-user-standby-1
      REPMGR_PARTNER_NODES: postgres-user-primary-0,postgres-user-standby-1:5432
    networks:
      - user_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  ### VIDEO SERVICE ###
  # DBs
  postgres-video-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5434:5432"
    volumes:
      - postgres_video_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-video-primary-0
      REPMGR_NODE_NAME: postgres-video-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-video-primary-0
      REPMGR_PARTNER_NODES: postgres-video-primary-0,postgres-video-standby-1:5432
    networks:
      - video_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  postgres-video-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5435:5432"
    volumes:
      - postgres_video_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-video-primary-0
      REPMGR_NODE_NAME: postgres-video-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-video-standby-1
      REPMGR_PARTNER_NODES: postgres-video-primary-0,postgres-video-standby-1:5432
    networks:
      - video_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  ### ADJUSTMENT SERVICE ###
  # DBs
  postgres-adjustment-primary-0:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5436:5432"
    volumes:
      - postgres_adjustment_primary_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-adjustment-primary-0
      REPMGR_NODE_NAME: postgres-adjustment-primary-0
      REPMGR_NODE_NETWORK_NAME: postgres-adjustment-primary-0
      REPMGR_PARTNER_NODES: postgres-adjustment-primary-0,postgres-adjustment-standby-1:5432
    networks:
      - adjustment_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  postgres-adjustment-standby-1:
    image: bitnami/postgresql-repmgr:15
    ports:
      - "5437:5432"
    volumes:
      - postgres_adjustment_standby_data:/bitnami/postgresql
    environment:
      <<: *common_variables
      REPMGR_PRIMARY_HOST: postgres-adjustment-primary-0
      REPMGR_NODE_NAME: postgres-adjustment-standby-1
      REPMGR_NODE_NETWORK_NAME: postgres-adjustment-standby-1
      REPMGR_PARTNER_NODES: postgres-adjustment-primary-0,postgres-adjustment-standby-1:5432
    networks:
      - adjustment_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

  # Meta DB
  postgres-adjustment-metadata:
    image: bitnami/postgresql:15
    ports:
      - "5438:5432"
    volumes:
      - postgres_adjustment_metadata:/bitnami/postgresql
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: adminpassword
      POSTGRESQL_USERNAME: myuser
      POSTGRESQL_PASSWORD: mypassword
      POSTGRESQL_DATABASE: settlement
    networks:
      - adjustment_network
    healthcheck: *postgres_health_check
    restart: unless-stopped

volumes:
  # Kafka
  zookeeper_data:
  kafka_data:

  # DBs
  postgres_user_primary_data:
  postgres_user_standby_data:
  postgres_video_primary_data:
  postgres_video_standby_data:
  postgres_adjustment_primary_data:
  postgres_adjustment_standby_data:
  postgres_adjustment_metadata:

networks:
  kafka_network:
  monitoring_network:
  user_network:
  video_network:
  adjustment_network:
  app_network: